spring.application.name=steviabank
spring.datasource.url=jdbc:postgresql://localhost:5432/banking_db
spring.datasource.username=root
spring.datasource.password=root

#spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/banking_db}
#spring.datasource.username=${DB_USERNAME:root}
#spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

otp.length=6
otp.expiry=5m
otp.max-attempts=5
otp.rate.base-delay=30s
otp.rate.max-delay=15m
otp.rate.reset-window=1h
otp.hash.secret=change-me-to-a-secure-secret

